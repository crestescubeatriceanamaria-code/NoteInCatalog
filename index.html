
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoteInCatalog</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#b51220;color:white;padding:24px 18px}
h1{margin:0;font-size:25px}
main{padding:18px}
.cards{display:flex;gap:10px}
.card{background:white;border-radius:12px;padding:15px;flex:1;text-align:center;box-shadow:0 1px 5px #ddd}
.number{font-size:25px;font-weight:bold;color:#b51220}
section{background:white;margin-top:18px;padding:16px;border-radius:12px}
button{background:#b51220;color:white;border:0;padding:12px;border-radius:8px}
</style>
</head>
<body>
<header>
<h1>NoteInCatalog</h1>
<p>Catalogul meu personal</p>
</header>
<main>
<div class="cards">
<div class="card">Absențe<div class="number">0</div></div>
<div class="card">Nemotivate<div class="number">0</div></div>
<div class="card">Media<div class="number">—</div></div>
</div>
<section>
<h3>Materii și note</h3>
<p>Încă nu există note.</p>
<p>Acesta este un catalog personal, neoficial.</p>
</section>
</main>
</body>
</html>
